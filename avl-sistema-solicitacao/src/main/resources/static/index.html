<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Árvore AVL - Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
        }

        .card {
            box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
            border: 0;
        }

        .tree {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            min-height: 240px;
            white-space: pre;
            font: 16px Consolas, monospace;
            overflow: auto;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .toast {
            --bs-toast-max-width: 380px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Árvore AVL — Solicitações</span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Cadastrar solicitação</h5>
                        <form id="formCadastro">
                            <div class="mb-3">
                                <label for="numero" class="form-label">Número</label>
                                <input id="numero" type="number" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="solicitante" class="form-label">Solicitante</label>
                                <input id="solicitante" type="text" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="descricao" class="form-label">Descrição</label>
                                <input id="descricao" class="form-control">
                            </div>
                            <button class="btn btn-primary w-100">Inserir na AVL</button>
                        </form>
                        <hr>
                        <button id="carregarExemplo" class="btn btn-outline-secondary w-100">
                            Carregar dados do exercício
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0">Visualização da AVL</h5>
                            <button id="atualizar" class="btn btn-sm btn-outline-primary">Atualizar</button>
                        </div>
                        <p class="text-muted small mt-2">O valor entre colchetes representa o fator de balanceamento
                            (FB).</p>
                        <pre id="arvore" class="tree">Carregando...</pre>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Solicitações — percurso em ordem</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Solicitante</th>
                                <th>Data de Abertura</th>
                                <th>Descrição</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast substitui alert()/popup e não interrompe a interação do usuário. -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotificacao" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitulo">Sistema AVL</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
            <div class="toast-body" id="toastMensagem"></div>
        </div>
    </div>

    <div class="modal fade" id="modalEdicao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">ALTERAR SOLICITAÇÃO</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEdicao">
                        <div class="mb-3">
                            <label class="form-label">Número (Somente Leitura)</label>
                            <input id="editNumero" type="text" class="form-control" readonly disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data de Abertura (Somente Leitura)</label>
                            <input id="editData" type="text" class="form-control" readonly disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Solicitante</label>
                            <input id="editSolicitante" type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <input id="editDescricao" type="text" class="form-control">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarAlteracao()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = '/solicitacoes';
        let modalBootstrap;

        function mostrarToast(titulo, mensagem) {
            document.getElementById('toastTitulo').textContent = titulo;
            document.getElementById('toastMensagem').textContent = mensagem;

            const elemento = document.getElementById('toastNotificacao');
            const toast = bootstrap.Toast.getOrCreateInstance(elemento, { delay: 3000 });
            toast.show();
        }

        async function lerJsonSeguro(resposta) {
            try {
                return await resposta.json();
            } catch {
                return { sucesso: false, mensagem: 'Resposta inválida do servidor.' };
            }
        }

        function formatarData(dataIso) {
            if (!dataIso) return "";
            const dt = new Date(dataIso);
            return dt.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function atualizar() {
            try {
                const [listaResp, arvoreResp] = await Promise.all([
                    fetch(API), fetch(API + '/arvore')
                ]);

                const lista = await listaResp.json();
                const arvore = await arvoreResp.text();

                document.getElementById('arvore').textContent = arvore.trim() || '(árvore vazia)';

                document.getElementById('tabela').innerHTML = lista.length
                    ? lista.map(s => `
                <tr>
                    <td><strong>${s.numero}</strong></td>
                    <td>${s.solicitante || '---'}</td>
                    <td>${formatarData(s.dataAbertura)}</td>
                    <td>${s.descricao}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" 
                                onclick='abrirModal(${JSON.stringify(s).replace(/'/g, "&apos;")})'>
                            Editar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="remover(${s.numero})">
                            Remover
                        </button>
                    </td>
                </tr>`).join('')
                    : '<tr><td colspan="5" class="text-center text-muted">Nenhuma solicitação cadastrada.</td></tr>';
            } catch (erro) {
                mostrarToast('Erro', 'Não foi possível acessar a API.');
            }
        }

        function abrirModal(solicitacao) {
            document.getElementById('editNumero').value = solicitacao.numero;
            document.getElementById('editData').value = formatarData(solicitacao.dataAbertura);
            document.getElementById('editSolicitante').value = solicitacao.solicitante;
            document.getElementById('editDescricao').value = solicitacao.descricao;

            modalBootstrap = new bootstrap.Modal(document.getElementById('modalEdicao'));
            modalBootstrap.show();
        }

        async function salvarAlteracao() {
            const numero = document.getElementById('editNumero').value;
            const solicitante = document.getElementById('editSolicitante').value.trim();
            const descricao = document.getElementById('editDescricao').value.trim();

            if (!solicitante) {
                mostrarToast('Atenção', 'Informe o nome do solicitante.');
                return;
            }
            if (!descricao) {
                mostrarToast('Atenção', 'Informe a descrição da solicitação.');
                return;
            }

            try {
                const resposta = await fetch(`${API}/${numero}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ solicitante, descricao })
                });

                const dados = await lerJsonSeguro(resposta);

                if (!resposta.ok) {
                    throw new Error(dados.mensagem);
                }

                modalBootstrap.hide();
                mostrarToast('Sucesso', 'Solicitação alterada com sucesso.');
                await atualizar();

            } catch (erro) {
                mostrarToast('Erro', erro.message);
            }
        }

        async function inserir(numero, solicitante, descricao, silencioso = false) {
            const resposta = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numero, solicitante, descricao })
            });

            const dados = await lerJsonSeguro(resposta);

            if (!resposta.ok) {
                throw new Error(dados.mensagem || 'Não foi possível cadastrar.');
            }

            if (!silencioso) {
                mostrarToast('Sucesso', dados.mensagem);
            }
        }

        async function remover(numero) {
            try {
                const resposta = await fetch(API + '/' + numero, { method: 'DELETE' });
                const dados = await lerJsonSeguro(resposta);

                if (!resposta.ok) {
                    mostrarToast('Atenção', dados.mensagem || 'Solicitação não encontrada.');
                    return;
                }

                mostrarToast('Remoção', dados.mensagem);
                await atualizar();
            } catch (erro) {
                mostrarToast('Erro', 'Não foi possível comunicar com o servidor.');
            }
        }

        document.getElementById('formCadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const numero = Number(document.getElementById('numero').value);
            const solicitante = document.getElementById('solicitante').value.trim();
            const descricao = document.getElementById('descricao').value.trim();

            if (!numero) {
                mostrarToast('Atenção', 'Informe o número da solicitação.');
                return;
            }
            if (!solicitante) {
                mostrarToast('Atenção', 'Informe o nome do solicitante.');
                return;
            }
            if (!descricao) {
                mostrarToast('Atenção', 'Informe a descrição da solicitação.');
                return;
            }

            try {
                await inserir(numero, solicitante, descricao);
                evento.target.reset();
                document.getElementById('numero').focus();
                await atualizar();
            } catch (erro) {
                mostrarToast('Erro', erro.message);
            }
        });

        document.getElementById('atualizar').addEventListener('click', atualizar);

        document.getElementById('carregarExemplo').addEventListener('click', async () => {
            const dados = [
                [50, 'Paulo Lima', 'Problema no servidor'],
                [30, 'Ana Clara', 'Computador não inicia'],
                [70, 'Carlos', 'Falha de conexão'],
                [20, 'Marcos', 'Impressora não funciona'],
                [40, 'Julia', 'Erro no sistema'],
                [60, 'Fernanda', 'Problema de acesso'],
                [80, 'Roberto', 'Troca de equipamento'],
                [10, 'Amanda', 'Instalação de software'],
                [25, 'Diego', 'Configuração de usuário']
            ];

            let inseridos = 0;

            for (const [numero, solicitante, descricao] of dados) {
                try {
                    await inserir(numero, solicitante, descricao, true);
                    inseridos++;
                } catch {
                    // Registros já existentes são ignorados ao carregar o exemplo.
                }
            }

            if (inseridos > 0) {
                mostrarToast('Exemplo carregado', `${inseridos} solicitação(ões) inserida(s).`);
            } else {
                mostrarToast('Informação', 'Os dados do exercício já estão cadastrados.');
            }

            await atualizar();
        });

        atualizar();
    </script>
</body>

</html>
